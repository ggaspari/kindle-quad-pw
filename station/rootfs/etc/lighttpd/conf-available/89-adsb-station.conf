# readsb's JSON for the Quad Board server and anything else on the LAN:
#   http://<station>/data/aircraft.json   (also receiver.json, stats.json)
server.modules += ( "mod_alias", "mod_setenv" )
$HTTP["url"] =~ "^/data/" {
    alias.url += ( "/data/" => "/run/readsb/" )
    setenv.add-response-header += ( "Access-Control-Allow-Origin" => "*",
                                    "Cache-Control" => "no-cache" )
}

# Estação ADS-B: configuração do primeiro boot.
#
# Este arquivo fica na partição "boot" do cartão SD (FAT, abre no Windows).
# Edite ANTES do primeiro boot. Depois que a estação se configurar, a senha
# abaixo é apagada deste arquivo e o log fica em adsb-firstboot.log, ao lado.
# Para rodar a configuração de novo: apague o arquivo adsb-firstboot.done.

# Nome na rede: a estação responde em http://<HOSTNAME>.local
HOSTNAME=adsb-station
TIMEZONE=America/Bahia

# Usuário para SSH (com sudo). O usuário root fica bloqueado.
USERNAME=adsb
PASSWORD=
# Recomendado: sua chave pública (uma linha, ssh-ed25519 ...). Com ela, a senha é opcional.
SSH_PUBKEY=

# Posição da antena: melhora a decodificação e o alcance. Graus decimais, altitude em metros.
LAT=-12.9711
LON=-38.5108
ALT_M=10

# Ganho do RTL-SDR: auto (recomendado no começo) ou um valor como 49.6
GAIN=auto
# Liga a alimentação de 4,5 V pelo cabo (bias-tee) para um LNA/filtro externo: yes | no
BIAS_TEE=no

# Mapa tar1090 em http://<HOSTNAME>.local/tar1090 (baixa da internet no primeiro boot): yes | no
TAR1090=yes

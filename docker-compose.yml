# Quad Board server for CasaOS (or any Docker host).
#   cp .env.example .env    # set QUAD_TOKEN and QUAD_ADMIN
#   docker compose up -d --build
name: quadboard

services:
  quadboard:
    build: .
    image: kindle-quad-pw:local
    container_name: quadboard
    restart: unless-stopped
    ports:
      - "8740:8740"
    environment:
      TZ: America/Sao_Paulo
      QUAD_TOKEN: ${QUAD_TOKEN:?set QUAD_TOKEN in .env}
      QUAD_ADMIN: ${QUAD_ADMIN:?set QUAD_ADMIN in .env}
      # optional: Claude's one-line brief, on your Claude subscription (`claude setup-token`)
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      # CasaOS keeps app data under /DATA/AppData/<app>
      - /DATA/AppData/quadboard/data:/data
      - /DATA/AppData/quadboard/cache:/app/server/cache

x-casaos:
  architectures: [amd64, arm64]
  main: quadboard
  author: ggaspari
  category: Utilities
  description:
    en_us: E-paper dashboard server for a Kindle Paperwhite (weather, news, markets, Brasileirão, planes overhead).
    pt_br: Servidor do painel e-paper para o Kindle Paperwhite (clima, notícias, mercado, Brasileirão, aviões).
  tagline:
    en_us: Kitchen dashboard for e-paper screens
    pt_br: Painel de cozinha para telas e-paper
  title:
    en_us: Quad Board
  port_map: "8740"
  index: /
